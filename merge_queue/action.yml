name: "merge-queue"
description: "A merge queue for GitHub Actions. Label a PR, it rebases, waits for CI, and squash merges."
author: "nimblehq"

branding:
  icon: "git-merge"
  color: "purple"

inputs:
  github-token:
    description: "GitHub token with repo permissions"
    required: true
    default: ${{ github.token }}
  label:
    description: "Label that triggers the merge queue"
    required: false
    default: "mergeme"
  poll-interval:
    description: "Seconds between status check polls"
    required: false
    default: "30"
  timeout:
    description: "Max seconds to wait for status checks"
    required: false
    default: "1800"

outputs:
  result:
    description: "Result of the last PR processed: merged or failed"
    value: ${{ steps.merge.outputs.result }}

runs:
  using: "composite"
  steps:
    - name: Ensure jq is available
      shell: bash
      run: |
        command -v jq &>/dev/null && exit 0
        case "${RUNNER_OS:-}" in
          Windows)
            mkdir -p "$RUNNER_TEMP/jq-bin"
            curl -fsSL -o "$RUNNER_TEMP/jq-bin/jq.exe" \
              "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe"
            echo "$RUNNER_TEMP/jq-bin" >> "$GITHUB_PATH"
            ;;
          Linux)   sudo apt-get install -y jq 2>/dev/null || sudo yum install -y jq ;;
          macOS)   brew install jq ;;
        esac

    - name: Rebase, wait for CI, squash merge
      id: merge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LABEL: ${{ inputs.label }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        TIMEOUT: ${{ inputs.timeout }}
      run: |
        set -euo pipefail
        REPO="${GITHUB_REPOSITORY}"
        API_BASE="https://api.github.com"

        api() {
          local method="$1" path="$2"
          shift 2
          curl -s -X "$method" \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${API_BASE}${path}" "$@"
        }

        urlencode() { printf '%s' "$1" | jq -sRr @uri; }

        # Remove label, post failure comment, write output
        dequeue() {
          local pr="$1" msg="$2"
          local label_enc
          label_enc=$(urlencode "$LABEL")
          api DELETE "/repos/${REPO}/issues/${pr}/labels/${label_enc}" >/dev/null 2>&1 || true
          api POST "/repos/${REPO}/issues/${pr}/comments" \
            -d "{\"body\": $(printf '%s' "$msg" | jq -Rs .)}" >/dev/null 2>&1 || true
          echo "result=failed" >> "$GITHUB_OUTPUT"
        }

        # Process one PR through rebase → CI wait → squash merge.
        # Always returns 0; failures dequeue the PR and return early.
        process_pr() {
          local PR_NUMBER="$1"

          # --- 1. Check PR state ---
          echo "::group::PR #${PR_NUMBER} — checking state"

          local PR_JSON STATE MERGEABLE BRANCH TITLE BASE
          PR_JSON=$(api GET "/repos/${REPO}/pulls/${PR_NUMBER}")
          # REST API returns lowercase state and boolean/null mergeable — normalise to match original values
          STATE=$(printf '%s' "$PR_JSON" | jq -r '.state | ascii_upcase')
          MERGEABLE=$(printf '%s' "$PR_JSON" | jq -r 'if .mergeable == true then "MERGEABLE" elif .mergeable == false then "CONFLICTING" else "UNKNOWN" end')
          BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.head.ref')
          TITLE=$(printf '%s' "$PR_JSON" | jq -r '.title')
          BASE=$(printf '%s' "$PR_JSON" | jq -r '.base.ref')

          echo "PR: #${PR_NUMBER} — ${TITLE}"
          echo "Branch: ${BRANCH} → ${BASE}"
          echo "State: ${STATE} / Mergeable: ${MERGEABLE}"
          echo "::endgroup::"

          if [[ "$STATE" != "OPEN" ]]; then
            local label_enc
            label_enc=$(urlencode "$LABEL")
            api DELETE "/repos/${REPO}/issues/${PR_NUMBER}/labels/${label_enc}" >/dev/null 2>&1 || true
            return 0
          fi

          if [[ "$MERGEABLE" == "CONFLICTING" ]]; then
            dequeue "$PR_NUMBER" "**Merge queue:** removed — PR has conflicts with \`${BASE}\`. Resolve and re-label \`${LABEL}\` to retry."
            return 0
          fi

          # GitHub computes mergeability asynchronously — poll briefly if UNKNOWN
          if [[ "$MERGEABLE" == "UNKNOWN" ]]; then
            local i
            for i in 1 2 3; do
              sleep 5
              MERGEABLE=$(api GET "/repos/${REPO}/pulls/${PR_NUMBER}" | \
                jq -r 'if .mergeable == true then "MERGEABLE" elif .mergeable == false then "CONFLICTING" else "UNKNOWN" end')
              echo "  Mergeability retry ${i}: ${MERGEABLE}"
              [[ "$MERGEABLE" != "UNKNOWN" ]] && break
            done
            if [[ "$MERGEABLE" == "CONFLICTING" ]]; then
              dequeue "$PR_NUMBER" "**Merge queue:** removed — PR has conflicts with \`${BASE}\`. Resolve and re-label \`${LABEL}\` to retry."
              return 0
            fi
          fi

          # --- 2. Rebase onto latest base branch ---
          echo "::group::Rebasing ${BRANCH} onto ${BASE}"

          # Configure git identity for rebase commits
          git config user.email "nimblehq-merge-queue[bot]@users.noreply.github.com"
          git config user.name "nimblehq-merge-queue[bot]"

          git fetch origin "$BASE" "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          if ! git rebase "origin/$BASE"; then
            git rebase --abort
            echo "::endgroup::"
            dequeue "$PR_NUMBER" "**Merge queue:** rebase onto \`${BASE}\` failed due to conflicts. Resolve and re-label \`${LABEL}\` to retry."
            return 0
          fi

          # Push directly to token URL to ensure the PAT is used (not GITHUB_TOKEN
          # from checkout). PAT pushes trigger workflows; GITHUB_TOKEN pushes don't.
          local PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if ! git push "$PUSH_URL" "$BRANCH" --force-with-lease; then
            echo "::endgroup::"
            dequeue "$PR_NUMBER" "**Merge queue:** failed to push rebased branch. Re-label \`${LABEL}\` to retry."
            return 0
          fi

          # Capture SHA of the rebased commit — used for check-run polling below
          local PR_SHA
          PR_SHA=$(git rev-parse HEAD)

          echo "Rebased ${BRANCH} onto latest ${BASE}"
          echo "::endgroup::"

          # --- 3. Wait for status checks ---
          echo "::group::Waiting for status checks on PR #${PR_NUMBER}"

          # Exclude this workflow's own check suite so we don't wait on ourselves
          local CURRENT_SUITE_ID
          CURRENT_SUITE_ID=$(api GET "/repos/${REPO}/actions/runs/${GITHUB_RUN_ID}" | \
            jq -r '(.check_suite_id // 0) | tostring')

          local ELAPSED=0 CHECK_RESULT="pending" CHECK_STATE CHECKS_SEEN="false"
          # Grace period: wait at least this long before treating "no checks" as
          # a pass, giving CI workflows time to register check runs on the new commit.
          local GRACE=60
          while true; do
            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))

            # Fetch check runs for the rebased commit
            local CR_TMP CR_HTTP CR_BODY
            CR_TMP=$(mktemp)
            CR_HTTP=$(curl -s -w "%{http_code}" -o "$CR_TMP" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API_BASE}/repos/${REPO}/commits/${PR_SHA}/check-runs?per_page=100")
            CR_BODY=$(cat "$CR_TMP"); rm -f "$CR_TMP"

            if [[ "$CR_HTTP" -ge 400 ]]; then
              echo "Failed to fetch check runs: HTTP ${CR_HTTP}"
              CHECK_RESULT="fail"
              break
            fi

            # Normalise conclusions to uppercase state values; exclude this workflow's suite
            local CHECK_RAW
            CHECK_RAW=$(printf '%s' "$CR_BODY" | jq \
              --arg suite_id "$CURRENT_SUITE_ID" \
              'if has("check_runs") then
                [.check_runs[] |
                  select((.check_suite.id | tostring) != $suite_id) |
                  {
                    name: .name,
                    state: (
                      if .status != "completed" then "PENDING"
                      elif .conclusion == "success" then "SUCCESS"
                      elif .conclusion == "failure" then "FAILURE"
                      elif .conclusion == "startup_failure" then "FAILURE"
                      elif .conclusion == "neutral" then "NEUTRAL"
                      elif .conclusion == "cancelled" then "CANCELLED"
                      elif .conclusion == "skipped" then "SKIPPED"
                      elif .conclusion == "timed_out" then "TIMED_OUT"
                      elif .conclusion == "action_required" then "ACTION_REQUIRED"
                      elif .conclusion == "stale" then "NEUTRAL"
                      else "FAILURE"
                      end
                  }
                ]
              else [] end')

            # Also include legacy commit statuses (deduplicate by context, keep latest)
            local ST_TMP ST_RAW
            ST_TMP=$(mktemp)
            curl -s -o "$ST_TMP" \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API_BASE}/repos/${REPO}/commits/${PR_SHA}/statuses?per_page=100"
            ST_RAW=$(jq 'if type == "array" then
                [group_by(.context)[] | sort_by(.updated_at) | last |
                  {
                    name: .context,
                    state: (
                      if .state == "success" then "SUCCESS"
                      elif .state == "failure" then "FAILURE"
                      elif .state == "error" then "ERROR"
                      else "PENDING"
                      end
                    )
                  }
                ]
              else [] end' "$ST_TMP")
            rm -f "$ST_TMP"

            local COMBINED_RAW
            COMBINED_RAW=$(printf '%s\n%s' "$CHECK_RAW" "$ST_RAW" | jq -s 'add')

            CHECK_STATE=$(printf '%s' "$COMBINED_RAW" | jq -r \
              'if length == 0 then "no_checks"
               elif any(.state | test("^(FAILURE|ERROR|CANCELLED|ACTION_REQUIRED|TIMED_OUT)$")) then "fail"
               elif all(.state | test("^(SUCCESS|NEUTRAL|SKIPPED)$")) then "pass"
               else "pending"
               end')

            echo "  CHECK_RAW: ${COMBINED_RAW}"
            echo "  ${ELAPSED}s — checks: ${CHECK_STATE}"

            [[ "$CHECK_STATE" != "no_checks" ]] && CHECKS_SEEN="true"

            if [[ "$CHECK_STATE" == "pass" ]]; then
              CHECK_RESULT="pass"
              echo "All checks passed."
              break
            fi

            if [[ "$CHECK_STATE" == "no_checks" && ( "$CHECKS_SEEN" == "true" || "$ELAPSED" -ge "$GRACE" ) ]]; then
              CHECK_RESULT="pass"
              echo "No status checks configured — proceeding."
              break
            fi

            if [[ "$CHECK_STATE" == "fail" ]]; then
              CHECK_RESULT="fail"
              break
            fi

            if [[ "$ELAPSED" -ge "$TIMEOUT" ]]; then
              CHECK_RESULT="timeout"
              break
            fi
          done
          echo "::endgroup::"

          if [[ "$CHECK_RESULT" == "fail" ]]; then
            dequeue "$PR_NUMBER" "**Merge queue:** status checks failed after rebase onto \`${BASE}\`. Fix and re-label \`${LABEL}\` to retry."
            return 0
          fi

          if [[ "$CHECK_RESULT" == "timeout" ]]; then
            dequeue "$PR_NUMBER" "**Merge queue:** timed out waiting for status checks (${TIMEOUT}s). Re-label \`${LABEL}\` to retry."
            return 0
          fi

          # --- 4. Squash merge ---
          echo "::group::Squash merging PR #${PR_NUMBER}"

          local MERGE_TMP MERGE_HTTP
          MERGE_TMP=$(mktemp)
          MERGE_HTTP=$(curl -s -w "%{http_code}" -o "$MERGE_TMP" \
            -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "${API_BASE}/repos/${REPO}/pulls/${PR_NUMBER}/merge" \
            -d '{"merge_method": "squash"}')
          rm -f "$MERGE_TMP"

          if [[ "$MERGE_HTTP" -eq 200 ]]; then
            api DELETE "/repos/${REPO}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
            echo "::endgroup::"
            echo "::notice::PR #${PR_NUMBER} squash merged into ${BASE}"
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "::endgroup::"
            dequeue "$PR_NUMBER" "**Merge queue:** squash merge failed. This can happen if branch protection rules are not met. Fix and re-label \`${LABEL}\` to retry."
          fi
        }

        # --- Queue loop: process all labeled PRs in order ---
        # Brief pause to let the label propagate through GitHub's API
        # (the labeled event can fire before the API sees the label)
        sleep 5
        PROCESSED=""
        EMPTY_RETRIES=0
        LABEL_ENCODED=$(urlencode "$LABEL")
        while true; do
          PR_NUMBER=$(api GET "/repos/${REPO}/issues?state=open&labels=${LABEL_ENCODED}&sort=created&direction=asc&per_page=100" | \
            jq -r '[.[] | select(.pull_request != null) | .number] | sort | first // empty')

          if [[ -z "$PR_NUMBER" ]]; then
            if [[ "$EMPTY_RETRIES" -lt 3 ]]; then
              EMPTY_RETRIES=$((EMPTY_RETRIES + 1))
              echo "Queue appears empty, retrying in 5s... (${EMPTY_RETRIES}/3)"
              sleep 5
              continue
            fi
            echo "Queue empty."
            break
          fi
          EMPTY_RETRIES=0

          # Skip PRs already processed (label removal may not have propagated)
          if [[ " $PROCESSED " == *" $PR_NUMBER "* ]]; then
            echo "PR #${PR_NUMBER} already processed, waiting for label removal to propagate..."
            sleep 5
            continue
          fi

          process_pr "$PR_NUMBER" || {
            # Unexpected failure — remove from queue to avoid infinite loop
            api DELETE "/repos/${REPO}/issues/${PR_NUMBER}/labels/${LABEL_ENCODED}" >/dev/null 2>&1 || true
            echo "result=failed" >> "$GITHUB_OUTPUT"
          }
          PROCESSED="$PROCESSED $PR_NUMBER"
        done
